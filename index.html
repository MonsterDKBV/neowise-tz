<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script type="module">
    const form = document.querySelector("form");
    const result = document.querySelector("#result");
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цена", other: "Другое" };
    // Manual review shows the original request so the manager can handle it by hand.
    const manualText = (text) => `Не удалось разобрать, проверьте вручную.\n\nИсходная заявка:\n${text}`;
    let controller;

    function render(data, text) {
      if (data.status === "ready") {
        return `Тема: ${TOPIC_LABELS[data.topic]}\n\nЧерновик ответа:\n${data.draft}`;
      }
      if (data.status === "invalid_input") return "Введите текст заявки.";
      return manualText(text);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = document.querySelector("#message").value;
      // Cancel the previous request so a late answer cannot overwrite the new one.
      controller?.abort();
      controller = new AbortController();
      // Clear the previous draft right away.
      result.textContent = "Разбираю заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: controller.signal,
        });
        result.textContent = render(await reply.json(), text);
      } catch (error) {
        if (error.name === "AbortError") return;
        result.textContent = manualText(text);
      }
    });
  </script>
</body>
</html>
